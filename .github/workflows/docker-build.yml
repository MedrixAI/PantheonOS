name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'docker/**'
      - 'pantheon/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'executor/**'
      - 'funcdesc/**'
      - 'cmd2func/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: pantheon-agent-image
  cancel-in-progress: false

env:
  REGISTRY: 844646328509.dkr.ecr.ap-southeast-1.amazonaws.com
  AWS_REGION: ap-southeast-1
  DOCKERFILE_PATH: docker/Dockerfile

jobs:
  build-and-push:
    # Self-hosted runner in the ACK production-ci namespace (native amd64,
    # dind sidecar). ECR push credentials and the ACK kubeconfig are mounted
    # into the runner pod from secrets medrix-ci-aws / medrix-ci-kubeconfig.
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version and commit tag
        id: meta
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+(?=")' pantheon/__init__.py)
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pantheon version: $VERSION (sha-$SHA)"

      - name: Build Docker image
        run: |
          TAGS="-t $REGISTRY/medrix/pantheon-agents:sha-${{ steps.meta.outputs.sha }}"
          TAGS="$TAGS -t $REGISTRY/medrix/pantheon-agents:${{ steps.meta.outputs.version }}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS="$TAGS -t $REGISTRY/medrix/pantheon-agents:latest"
          fi
          docker build -f "$DOCKERFILE_PATH" $TAGS .

      - name: Push to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker push "$REGISTRY/medrix/pantheon-agents:sha-${{ steps.meta.outputs.sha }}"
          docker push "$REGISTRY/medrix/pantheon-agents:${{ steps.meta.outputs.version }}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker push "$REGISTRY/medrix/pantheon-agents:latest"
          fi

      - name: Point production hub at the new agent image
        if: github.ref == 'refs/heads/main'
        run: |
          DIGEST=$(aws ecr describe-images --region "$AWS_REGION" \
            --repository-name medrix/pantheon-agents \
            --image-ids imageTag=sha-${{ steps.meta.outputs.sha }} \
            --query 'imageDetails[0].imageDigest' --output text)
          kubectl set env deployment/pantheon-hub -n pantheon \
            K8S_CHATROOM_IMAGE="$REGISTRY/medrix/pantheon-agents@$DIGEST"
          kubectl rollout status deployment/pantheon-hub -n pantheon --timeout=300s
          echo "✅ Hub now spawns agents from $DIGEST"